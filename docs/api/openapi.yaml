  /admin/media:
    get:
      tags: [Admin Media]
      operationId: listAdminMedia
      summary: Daftar media library
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Daftar media dan metadata penggunaan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin Media]
      operationId: uploadAdminMedia
      summary: Mengunggah file media
      description: |
        Backend memvalidasi isi file, MIME type, ukuran, dan ekstensi yang
        diizinkan. Batas ukuran dan daftar tipe file ditetapkan oleh konfigurasi
        implementasi. Response mengembalikan metadata, bukan binary file.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                altText:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Media berhasil diunggah.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          description: File melebihi batas ukuran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Jenis file tidak didukung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/media/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin Media]
      operationId: getAdminMedia
      summary: Detail metadata media
      security:
        - AdminSession: []
      responses:
        '200':
          description: Metadata media dan informasi apakah sedang digunakan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin Media]
      operationId: deleteAdminMedia
      summary: Menghapus media yang tidak digunakan
      description: |
        Media yang direferensikan konten apa pun, termasuk draft dan archived,
        tidak boleh dihapus. Backend wajib memeriksa relasi secara atomik.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Media berhasil dihapus.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Media masih digunakan oleh konten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: portfolio_session
      description: |
        Cookie sesi dikelola backend/auth library. Cookie production harus
        Secure, HttpOnly, dan SameSite dikonfigurasi sesuai deployment.
        Masa sesi target 8–12 jam; durasi aktual ditetapkan saat implementasi.
  headers:
    SessionCookie:
      description: |
        Set-Cookie untuk sesi. Atribut final (Path, HttpOnly, Secure, SameSite,
        Max-Age/Expires) ditetapkan sesuai deployment dan library autentikasi.
      schema:
        type: string
    ExpiredSessionCookie:
      description: Set-Cookie yang menghapus/mengakhiri cookie sesi.
      schema:
        type: string
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID resource.
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token yang didapat melalui GET /auth/csrf.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request tidak valid atau format JSON rusak.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Sesi tidak ada, tidak valid, kedaluwarsa, atau dicabut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfForbidden:
      description: Token CSRF tidak ada atau tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource tidak ditemukan atau tidak tersedia untuk publik.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Konflik data, misalnya slug duplikat.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Data gagal validasi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    TooManyRequests:
      description: Batas percobaan request terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Kesalahan internal yang tidak tertangani.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AdminUser:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    Profile:
      type: object
      required: [displayName, headline, bio, contact]
      properties:
        displayName:
          type: string
        headline:
          type: string
        bio:
          type: string
          description: Teks profil; frontend harus merender sebagai teks aman.
        avatar:
          oneOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
        contact:
          $ref: '#/components/schemas/ContactLinks'
        updatedAt:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        headline:
          type: string
          maxLength: 200
        bio:
          type: string
          maxLength: 10000
        contact:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            email:
              oneOf:
                - type: string
                  format: email
                - type: 'null'
            instagramUrl:
              oneOf:
                - type: string
                  format: uri
                - type: 'null'
            githubUrl:
              oneOf:
                - type: string
                  format: uri
                - type: 'null'
            linkedinUrl:
              oneOf:
                - type: string
                  format: uri
                - type: 'null'
        avatarMediaId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    ContactLinks:
      type: object
      properties:
        email:
          oneOf:
            - type: string
              format: email
            - type: 'null'
        instagramUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        githubUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        linkedinUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
    ContentStatus:
      type: string
      enum: [draft, published, archived]
    Skill:
      type: object
      required: [id, name, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          oneOf:
            - type: string
              enum: [language, framework, database, testing_tool, other]
            - type: 'null'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SkillCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          oneOf:
