openapi: 3.1.0
info:
  title: Personal Portfolio API
  version: 1.0.0
  description: |
    Kontrak resmi REST API untuk personal portfolio dan CMS.
    Frontend dan backend berada di repository terpisah; perubahan kontrak perlu
    direview agar tetap kompatibel. Semua endpoint memakai prefix /api/v1.
servers:
  - url: https://api.example.com/api/v1
    description: Production placeholder; ganti dengan domain API final.
  - url: http://localhost:8000/api/v1
    description: Local development placeholder.
tags:
  - name: Authentication
    description: Login, identitas sesi, CSRF, dan logout admin.
  - name: Public Profile
    description: Profil yang ditampilkan pada website publik.
  - name: Public Projects
    description: Konten proyek yang sudah dipublikasikan.
  - name: Public Experiences
    description: Pengalaman kerja dan organisasi yang sudah dipublikasikan.
  - name: Public Education
    description: Riwayat pendidikan yang ditampilkan secara publik.
  - name: Admin Profile
    description: Pengelolaan profil admin.
  - name: Admin Projects
    description: Pengelolaan proyek CMS.
  - name: Admin Experiences
    description: Pengelolaan pengalaman CMS.
  - name: Admin Education
    description: Pengelolaan riwayat pendidikan CMS.
  - name: Admin Skills
    description: Katalog skill terpusat.
  - name: Admin Media
    description: Media library dan metadata file.
security: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginAdmin
      summary: Login admin
      description: |
        Jika kredensial valid, backend membuat sesi dan mengirim Set-Cookie.
        Cookie sesi tidak dikembalikan di JSON. Terapkan rate limiting dan
        gunakan pesan generik untuk kredensial yang tidak valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil; session cookie dikirim melalui Set-Cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email atau password tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Mendapatkan token CSRF
      description: |
        Mengembalikan token CSRF untuk digunakan pada request yang mengubah
        state. Mekanisme token harus disesuaikan dengan library autentikasi
        yang dipilih. Endpoint ini dapat tetap publik secara autentikasi,
        tetapi token harus terikat/tervalidasi sesuai sesi dan strategi CSRF.
      responses:
        '200':
          description: Token CSRF berhasil dibuat atau diambil.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [csrfToken]
                    properties:
                      csrfToken:
                        type: string
                        minLength: 1
                        description: Token dikirim kembali melalui header X-CSRF-Token.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAdmin
      summary: Mendapatkan admin yang sedang login
      security:
        - AdminSession: []
      responses:
        '200':
          description: Sesi valid.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutAdmin
      summary: Logout admin
      description: |
        Membatalkan sesi di server dan mengirim cookie kedaluwarsa.
        Karena endpoint ini mengubah state, request wajib memenuhi validasi CSRF.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Logout berhasil; tidak ada response body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ExpiredSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile:
    get:
      tags: [Public Profile]
      operationId: getPublicProfile
      summary: Mendapatkan profil publik
      description: Mengembalikan profil utama dan tautan kontak publik.
      responses:
        '200':
          description: Profil tersedia.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '404':
          description: Profil publik belum tersedia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects:
    get:
      tags: [Public Projects]
      operationId: listPublicProjects
      summary: Daftar proyek publik
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar proyek yang berstatus published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{slug}:
    get:
      tags: [Public Projects]
      operationId: getPublicProjectBySlug
      summary: Detail proyek publik
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Proyek ditemukan dan berstatus published.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /experiences:
    get:
      tags: [Public Experiences]
      operationId: listPublicExperiences
      summary: Daftar pengalaman publik
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [work, organization]
          description: Filter opsional berdasarkan jenis pengalaman.
      responses:
        '200':
          description: Daftar pengalaman berstatus published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExperiencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /experiences/{slug}:
    get:
      tags: [Public Experiences]
      operationId: getPublicExperienceBySlug
      summary: Detail pengalaman publik
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Pengalaman ditemukan dan berstatus published.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /education:
    get:
      tags: [Public Education]
      operationId: listPublicEducation
      summary: Daftar pendidikan publik
      responses:
        '200':
          description: Riwayat pendidikan publik.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Education'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/profile:
    get:
      tags: [Admin Profile]
      operationId: getAdminProfile
      summary: Mendapatkan profil untuk CMS
      security:
        - AdminSession: []
      responses:
        '200':
          description: Profil berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Admin Profile]
      operationId: updateAdminProfile
      summary: Memperbarui sebagian field profil
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Profil berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects:
    get:
      tags: [Admin Projects]
      operationId: listAdminProjects
      summary: Daftar proyek untuk CMS
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Daftar proyek termasuk draft dan archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin Projects]
      operationId: createAdminProject
      summary: Membuat draft proyek
      description: Konten baru dibuat sebagai draft; field selain title dapat belum lengkap.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Draft proyek dibuat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin Projects]
      operationId: getAdminProject
      summary: Detail proyek untuk CMS
      security:
        - AdminSession: []
      responses:
        '200':
          description: Detail proyek ditemukan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Admin Projects]
      operationId: updateAdminProject
      summary: Memperbarui sebagian field proyek
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Proyek berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{id}/publish:
    post:
      tags: [Admin Projects]
      operationId: publishAdminProject
      summary: Mempublikasikan proyek
      description: Backend memvalidasi semua field wajib sebelum status menjadi published.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Proyek dipublikasikan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{id}/unpublish:
    post:
      tags: [Admin Projects]
      operationId: unpublishAdminProject
      summary: Menarik proyek dari publikasi menjadi draft
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Proyek menjadi draft dan tidak lagi muncul di endpoint publik.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{id}/archive:
    post:
      tags: [Admin Projects]
      operationId: archiveAdminProject
      summary: Mengarsipkan proyek
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Proyek diarsipkan dan disembunyikan dari publik.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{id}/republish:
    post:
      tags: [Admin Projects]
      operationId: republishAdminProject
      summary: Menerbitkan kembali proyek yang diarsipkan
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Proyek berhasil dipublikasikan kembali setelah validasi.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/experiences:
    get:
      tags: [Admin Experiences]
      operationId: listAdminExperiences
      summary: Daftar pengalaman untuk CMS
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [work, organization]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Daftar pengalaman CMS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExperiencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin Experiences]
      operationId: createAdminExperience
      summary: Membuat draft pengalaman
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceCreate'
      responses:
        '201':
          description: Draft pengalaman dibuat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/experiences/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin Experiences]
      operationId: getAdminExperience
      summary: Detail pengalaman untuk CMS
      security:
        - AdminSession: []
      responses:
        '200':
          description: Pengalaman ditemukan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Admin Experiences]
      operationId: updateAdminExperience
      summary: Memperbarui sebagian field pengalaman
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperiencePatch'
      responses:
        '200':
          description: Pengalaman berhasil diperbarui.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/experiences/{id}/publish:
    post:
      tags: [Admin Experiences]
      operationId: publishAdminExperience
      summary: Mempublikasikan pengalaman
      description: Backend memvalidasi field wajib dan rentang tanggal sebelum publikasi.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Pengalaman dipublikasikan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/experiences/{id}/unpublish:
    post:
      tags: [Admin Experiences]
      operationId: unpublishAdminExperience
      summary: Mengubah pengalaman published menjadi draft
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Pengalaman tidak lagi tampil di endpoint publik.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/experiences/{id}/archive:
    post:
      tags: [Admin Experiences]
      operationId: archiveAdminExperience
      summary: Mengarsipkan pengalaman
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Pengalaman diarsipkan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/experiences/{id}/republish:
    post:
      tags: [Admin Experiences]
      operationId: republishAdminExperience
      summary: Menerbitkan kembali pengalaman yang diarsipkan
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Pengalaman berhasil dipublikasikan kembali.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
